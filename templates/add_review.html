{% extends "base.html" %}

{% block content %}

<h2>Review {{ product["name"] }}</h2>

<form method="POST">

    <label for="rating">Rating (1-5):</label>
    <input
        type="number"
        id="rating"
        name="rating"
        min="1"
        max="5"
        required
    >

    <br><br>

    <label for="review_text">Review:</label>
    <br>

    <textarea
        id="review_text"
        name="review_text"
        rows="5"
        maxlength="1000"
        required
    ></textarea>

    <br><br>

    <button type="submit">
        Submit Review
    </button>

</form>

{% endblock %}
