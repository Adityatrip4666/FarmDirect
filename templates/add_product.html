<!DOCTYPE html>
<html>

<head>
    <title>Add Product - FarmDirect</title>
</head>

<body>

    <h1>Add Product</h1>

    {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
    <p>{{ message }}</p>
    {% endfor %}
    {% endwith %}

    <form method="POST">

        <label for="name">Product Name:</label><br>
        <input type="text" id="name" name="name" required>
        <br><br>

        <label for="category">Category:</label><br>
        <select id="category" name="category" required>
            <option value="">Select Category</option>
            <option value="Vegetables">Vegetables</option>
            <option value="Fruits">Fruits</option>
            <option value="Grains">Grains</option>
            <option value="Pulses">Pulses</option>
            <option value="Spices">Spices</option>
            <option value="Other">Other</option>
        </select>
        <br><br>

        <label for="quantity">Quantity:</label><br>
        <input type="number" id="quantity" name="quantity" min="0.01" step="0.01" required>
        <br><br>

        <label for="price">Price:</label><br>
        <input type="number" id="price" name="price" min="0.01" step="0.01" required>
        <br><br>

        <label for="location">Location:</label><br>
        <input type="text" id="location" name="location" required>
        <br><br>

        <label for="quality_details">Quality Details:</label><br>
        <textarea id="quality_details" name="quality_details" rows="5"></textarea>
        <br><br>

        <button type="submit">Add Product</button>

    </form>

    <br>

    <a href="{{ url_for('my_products') }}">My Products</a>
    <br><br>

    <a href="{{ url_for('dashboard') }}">Back to Dashboard</a>

</body>

</html>
