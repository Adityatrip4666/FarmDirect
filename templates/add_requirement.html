{% extends "base.html" %}

{% block title %}Create Bulk Requirement - FarmDirect{% endblock %}

{% block content %}

<div class="section">

    <div class="section-heading">
        <h1>Create Bulk Requirement</h1>
        <p>
            Tell farmers and FPOs what agricultural products you need
            in bulk.
        </p>
    </div>

    <div class="form-card">

        <form method="POST">

            <div class="form-group">
                <label for="product_name">Product Name</label>
                <input type="text" id="product_name" name="product_name" placeholder="e.g. Wheat, Rice, Potato"
                    required>
            </div>

            <div class="form-group">
                <label for="category">Category</label>
                <input type="text" id="category" name="category" placeholder="e.g. Grains, Vegetables, Fruits" required>
            </div>

            <div class="form-group">
                <label for="quantity">Required Quantity</label>
                <input type="number" id="quantity" name="quantity" min="0.01" step="0.01"
                    placeholder="Enter required quantity" required>
            </div>

            <div class="form-group">
                <label for="target_price">Target Price</label>
                <input type="number" id="target_price" name="target_price" min="0.01" step="0.01"
                    placeholder="Enter your target price" required>
            </div>

            <div class="form-group">
                <label for="delivery_location">Delivery Location</label>
                <input type="text" id="delivery_location" name="delivery_location" placeholder="e.g. Delhi" required>
            </div>

            <div class="form-group">
                <label for="delivery_date">Delivery Date</label>
                <input type="date" id="delivery_date" name="delivery_date" required>
            </div>

            <div class="actions">
                <button type="submit">
                    Create Requirement
                </button>

                <a href="{{ url_for('my_requirements') }}" class="button button-light">
                    My Requirements
                </a>

                <a href="{{ url_for('dashboard') }}" class="button button-secondary">
                    Back to Dashboard
                </a>
            </div>

        </form>

    </div>

</div>

{% endblock %}
