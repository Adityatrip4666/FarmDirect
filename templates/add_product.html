{% extends "base.html" %}

{% block title %}Add Product - FarmDirect{% endblock %}

{% block content %}

<div class="form-card">

    <h1>Add Product</h1>

    <form method="POST">

        <label for="name">Product Name:</label>
        <input type="text" id="name" name="name" required>

        <br><br>

        <label for="category">Category:</label>
        <select id="category" name="category" required>
            <option value="">Select Category</option>
            <option value="Vegetables">Vegetables</option>
            <option value="Fruits">Fruits</option>
            <option value="Grains">Grains</option>
            <option value="Pulses">Pulses</option>
            <option value="Spices">Spices</option>
            <option value="Other">Other</option>
        </select>

        <br><br>

        <label for="quantity">Quantity:</label>
        <input
            type="number"
            id="quantity"
            name="quantity"
            min="0.01"
            step="0.01"
            required
        >

        <br><br>

        <label for="price">Price:</label>
        <input
            type="number"
            id="price"
            name="price"
            min="0.01"
            step="0.01"
            required
        >

        <br><br>

        <label for="location">Location:</label>
        <input type="text" id="location" name="location" required>

        <br><br>

        <label for="quality_details">Quality Details:</label>
        <textarea
            id="quality_details"
            name="quality_details"
            rows="5"
        ></textarea>

        <br><br>

        <div class="actions">

            <button
                type="submit"
                formaction="{{ url_for('suggest_product_price') }}"
            >
                Get AI Price Suggestion
            </button>

            <button type="submit">
                Add Product
            </button>

        </div>

    </form>

    <div class="actions">
        <a class="button button-secondary" href="{{ url_for('my_products') }}">
            My Products
        </a>

        <a class="button button-secondary" href="{{ url_for('dashboard') }}">
            Back to Dashboard
        </a>
    </div>

</div>

{% endblock %}
